version: "1.0"
name: 构建、测试与静态检查
displayName: 构建、测试与静态检查
stages:
- name: 构建验证
  displayName: 构建验证
  strategy: naturally
  trigger: auto
  steps:
  - step: build@golang
    name: build-go
    displayName: Golang 构建、测试与静态检查
    golangVersion: "1.24"
    commands:
    - set -eu
    - go version
    - go env GOPATH GOMODCACHE GOCACHE
    - 'env GOPROXY="${MING_GOPROXY:-https://goproxy.cn,direct}" make verify-pr'
    caches:
    - /go/pkg/mod
    - /root/.cache/go-build
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  pr:
    branches:
      precise:
        - master
notify: []
strategy:
  blocking: true
