name: ming-iot-kafka-local

# local-only：单节点 combined KRaft 仅用于本地开发和集成探针，不证明生产 HA。
x-ming-iot-profile: local-only

services:
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    hostname: kafka
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "127.0.0.1:39092:39092"
    volumes:
      - ./config/local:/mnt/shared/config:ro
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    networks: [kafka-local]
    restart: "no"

networks:
  kafka-local: {}

volumes:
  kafka_data: {}
