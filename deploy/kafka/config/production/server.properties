# ming-iot.profile=production-static-contract
# 这是至少 3 broker、3 controller 的生产静态契约样例，不由本地 compose 启动。
# 部署系统必须为每个节点渲染唯一 node.id、advertised.listeners 和证书材料。
process.roles=broker
node.id=1
controller.quorum.voters=101@controller-1.example.invalid:9093,102@controller-2.example.invalid:9093,103@controller-3.example.invalid:9093
controller.listener.names=CONTROLLER

listeners=BROKER://0.0.0.0:9092
advertised.listeners=BROKER://broker-1.example.invalid:9092
listener.security.protocol.map=BROKER:SASL_SSL,CONTROLLER:SSL
inter.broker.listener.name=BROKER
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
ssl.client.auth=required
config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
ssl.keystore.type=PKCS12
ssl.keystore.location=/run/secrets/kafka/broker.keystore.p12
ssl.keystore.password=${file:/run/secrets/kafka/passwords.properties:keystore.password}
ssl.key.password=${file:/run/secrets/kafka/passwords.properties:key.password}
ssl.truststore.type=PKCS12
ssl.truststore.location=/run/secrets/kafka/broker.truststore.p12
ssl.truststore.password=${file:/run/secrets/kafka/passwords.properties:truststore.password}

log.dirs=/var/lib/kafka/data
num.partitions=12
default.replication.factor=3
min.insync.replicas=2
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
share.coordinator.state.topic.replication.factor=3
share.coordinator.state.topic.min.isr=2

auto.create.topics.enable=false
unclean.leader.election.enable=false
log.message.timestamp.type=LogAppendTime
delete.topic.enable=true
