# 只用于 P1 验收：独立网络和卷，无宿主端口，无生产连接。
name: ming-iot-eventbus-baseline
services:
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    pull_policy: never
    hostname: kafka
    environment:
      CLUSTER_ID: P1BusVerifyIndependent1
    volumes:
      - ./config:/mnt/shared/config:ro
      - kafka_data:/var/lib/kafka/data
    networks: [isolated]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1']
      interval: 3s
      timeout: 5s
      retries: 40
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    pull_policy: never
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    networks: [isolated]
    mem_limit: 128m
    cpus: 1
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  cache-a:
    image: ming-iot-eventbus-baseline:local
    pull_policy: never
    command: [/app/probe, worker, a]
    networks: [isolated]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 1
    depends_on:
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
  cache-b:
    image: ming-iot-eventbus-baseline:local
    pull_policy: never
    command: [/app/probe, worker, b]
    networks: [isolated]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 1
    depends_on:
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
  probe:
    image: ming-iot-eventbus-baseline:local
    pull_policy: never
    command: [/app/probe, completion]
    profiles: [verify]
    networks: [isolated]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 1
networks:
  isolated:
    internal: true
volumes:
  kafka_data: {}
  redis_data: {}
