name: Monorepo checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monorepo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.4'
          cache: true
          cache-dependency-path: |
            backend/go.work.sum
            backend/*/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep
          rg --version
          python3 tooling/install_ci_tools.py
      - name: Validate workflow
        run: .cache/ci-tools/actionlint -shellcheck= .github/workflows/*.yml
      - name: Check complete reachable history and publication boundary
        run: make publication-check
      - name: Run complete service-free PR profile
        run: |
          umask 022
          make verify-pr
      - name: Show publication decision
        run: python3 tooling/publication.py status
