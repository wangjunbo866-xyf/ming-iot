Name: data
Host: 0.0.0.0
CpuThreshold: 0
Timeout: 1000000
MaxBytes: 1000000000
Port: 9218
NodeID: 1
Middlewares:
  Prometheus: false
Log:
  Encoding: plain
  #Mode: file
CacheRedis:
  - Host: redis:6379
    Pass:
    Type: node
Database:
  DBType: mysql
  DSN: ${CORE_DB_DSN}
#  DBType: pgsql
#  DSN: ${CORE_DB_DSN}
SysRpc:
  Enable: true
  Mode: grpc
  Conf:
    Timeout: 1000000
    Etcd:
      Hosts:
        - etcd:2379
      Key: sys.rpc