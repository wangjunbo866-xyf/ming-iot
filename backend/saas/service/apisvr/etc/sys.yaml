#系统管理模块配置-syssvr
Name: sys.rpc
ListenOn: 0.0.0.0:9180

UserToken:
  AccessSecret: ${CORE_USER_TOKEN_SECRET}
  AccessExpire: 36000000 #有效期为一小时

UserOpt:
  NeedUserName: true
  NeedPassWord: true
  PassLevel: 2

Map:
  Mode: gaode
  AccessKey: ${CORE_MAP_ACCESS_KEY}
  AccessSecret: ${CORE_MAP_ACCESS_SECRET}

GoogleJWKS:
  URL:
  HeaderName: X-YKHL-JWKS-TOKEN
  AccessToken:

Sms:
  Enable: true
  Mode: ali
  Tencent:
    AccessKeyID:
    AccessKeySecret:
    AppID:
    AppKey:
  Ali:
    AccessKeyID:
    AccessKeySecret:

# uni-push 2.0（配置方式同 ThirdJwtSecret：Secret 写在 sys.yaml）
UniPush:
  Enabled: false
  AppId: __UNI__F82AD01
  HttpUrl: https://env-00jxufuad0x3.dev-hz.cloudbasefunction.cn/yk-push-send
  Secret: ""
  TimeoutMs: 5000
  ForceNotification: true
  NotifyCodes:
    - ruleDeviceAlarm
    - ruleScene
  PushOnMessage: true
