#系统管理模块配置-syssvr
Name: sys.rpc
ListenOn: 0.0.0.0:9180
CpuThreshold: 0
Etcd:
  Hosts:
    - etcd:2379
  Key: sys.rpc
Log:
  Encoding: plain
  #Mode: file
Database:
  DBType: mysql
  DSN: ${CORE_DB_DSN}
#  DBType: pgsql
#  DSN: ${CORE_DB_DSN}
CacheRedis:
  - Host: redis:6379
    Pass:
    Type: node
UserToken:
  AccessSecret: ${CORE_USER_TOKEN_SECRET}
  AccessExpire: 36000000 #有效期为一小时
WexinMiniprogram:
  Open: true
  AppID: wx0a8aabe3ca57d4af
  AppSecret: ${CORE_WECHAT_MINI_APP_SECRET}
UserOpt:
  NeedUserName: true
  NeedPassWord: true
  PassLevel: 2
OssConf:
  OssType: minio
  PublicBucketName: ithings-public
  PrivateBucketName: ithings-private
  TemporaryBucketName: ithings-temporary
  AccessKeyID: ${CORE_OSS_ACCESS_KEY_ID}
  AccessKeySecret: ${CORE_OSS_ACCESS_KEY_SECRET}
  Location: minio:9000
  ConnectTimeout: 6000
  ReadWriteTimeout: 60000
  UseSSL: false
Map:
  Mode: gaode
  AccessKey: ${CORE_MAP_ACCESS_KEY}
  AccessSecret: ${CORE_MAP_ACCESS_SECRET}
WrongPasswordCounter:
  Captcha: 4 # 连续输错密码次数上限，需要输验证码
  Account:
    - triggerTimes: 8  # 触发次数 默认 8
      statistics: 5    # 统计时间 默认 5 单位：分钟
      forbiddenTime: 2 # 冻结时长 默认 2 单位：分钟
  Ip:
    - triggerTimes: 8  # 触发次数 默认 8
      statistics: 5    # 统计时间 默认 5 单位：分钟
      forbiddenTime: 2 # 冻结时长 默认 2 单位：分钟

TimedJobRpc:
  Enable: true
  Mode: direct
  RunProxy: true
  Conf:
    Timeout: 1000000