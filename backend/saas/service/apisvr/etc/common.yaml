Host: 0.0.0.0
CpuThreshold: 0
Timeout: 1000000
MaxBytes: 1000000000
Log:
  Encoding: plain
  #Mode: file
Etcd:
  Hosts:
    - localhost:2379
  Key:
CacheRedis:
  - Host: localhost:6379
    Pass:
    Type: node
Middlewares:
  Prometheus: false
Database:
  DBType: mysql
  DSN: ${CORE_DB_DSN}
#  DBType: pgsql
#  DSN: ${CORE_DB_DSN}
SysRpc:
  Enable: true
  Mode: direct
  RunProxy: true
  Conf:
    Timeout: 1000000
TimedJobRpc:
  Enable: true
  Mode: direct
  RunProxy: true
  Conf:
    Timeout: 1000000
TimedSchedulerRpc:
  Enable: true
  Mode: direct
  RunProxy: true
  Conf:
    Timeout: 1000000
Event:
  Nats:
    Url: nats://localhost:4222
OssConf:
  OssType: minio # 如果不需要minio,可以填写local,默认存储路径为 ../oss
  PublicBucketName: ithings-public
  PrivateBucketName: ithings-private
  TemporaryBucketName: ithings-temporary
  AccessKeyID: ${CORE_OSS_ACCESS_KEY_ID}
  AccessKeySecret: ${CORE_OSS_ACCESS_KEY_SECRET}
  Location: localhost:9000
  ConnectTimeout: 6000
  ReadWriteTimeout: 60000
  UseSSL: false
DevServer:
  Enabled: true
  Port: 7061
