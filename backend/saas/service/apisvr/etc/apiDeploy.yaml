# apiDeploy.yaml: deploy/ 容器编排下 apisvr 入口完整配置（confSuffix=Deploy 完整替换 api.yaml）。
# confSuffix 机制是「替换 + 前置合并 common」，故本文件需包含 api.yaml 的全部必要字段。
Name: api
Host: 0.0.0.0
Port: 7777

Rej:
  AccessSecret: ${CORE_REJ_ACCESS_SECRET}
  AccessExpire: 600     #过期时间单位秒
OpenAuth:
  Users:
    - UserName: nodeRed
      Password: ${CORE_OPENAUTH_NODERED_PASSWORD}
    - UserName: root
      Password: ${CORE_OPENAUTH_ROOT_PASSWORD}
Proxy:
  StaticProxy:
    - Router: /api/v1/view/
      Dest: http://localhost:7789
    - Router: /api/v1/app/
      Dest: http://localhost:8000
    - Router: /api/v1/lowcode/
      Dest: http://localhost:7788
    - Router: /api/v1/things/
      Dest: http://localhost:7788
    - Router: /api/v1/protocol/cloud/tencent/
      Dest: http://localhost:9363
    - Router: /api/v1/video/
      Dest: http://localhost:7800
    - Router: /api/v1/media/
      Dest: http://localhost:8088
    - Router: /api/v1/data/
      Dest: http://localhost:9218
    - Router: /api/v1/sale/
      Dest: http://localhost:9283
    - Router: /api/v1/tunnel/
      Dest: http://localhost:8533
    - Router: /oss/
      DeletePrefix: true
      Dest: http://localhost:9000
    - Router: /iot
      DeletePrefix: false
      Dest: http://localhost:9119
