syntax = "proto3";

package sys;

option go_package = "pb/sys";

import "base.proto";
import "role.proto";
import "google/protobuf/wrappers.proto";

service DepartmentManage{
  rpc deptInfoRead(DeptInfoReadReq)returns(DeptInfo);
  rpc deptInfoCreate(DeptInfo) returns(WithID); //添加部门
  rpc deptInfoIndex(DeptInfoIndexReq) returns(DeptInfoIndexResp); //获取部门列表
  rpc deptInfoUpdate(DeptInfo) returns(Empty); //更新部门
  rpc deptInfoDelete(WithID) returns(Empty); //删除部门


  rpc deptUserIndex(DeptUserIndexReq) returns (DeptUserIndexResp); //获取用户部门列表
  rpc deptUserMultiDelete(DeptUserMultiDeleteReq) returns(Empty); //添加部门
  rpc deptUserMultiCreate(DeptUserMultiCreateReq) returns(Empty); //添加部门

  rpc deptRoleIndex(DeptRoleIndexReq) returns (DeptRoleIndexResp); //获取用户部门列表
  rpc deptRoleMultiDelete(DeptRoleMultiSaveReq) returns(Empty); //添加部门
  rpc deptRoleMultiCreate(DeptRoleMultiSaveReq) returns(Empty); //添加部门

  rpc deptSyncJobExecute(DeptSyncJobExecuteReq)returns(DeptSyncJobExecuteResp);//从应用同步用户数据
  rpc deptSyncJobRead(DeptSyncJobReadReq)returns(DeptSyncJob);//获取同步任务详情
  rpc deptSyncJobCreate(DeptSyncJob) returns(WithID); //添加同步任务
  rpc deptSyncJobIndex(DeptSyncJobIndexReq) returns(DeptSyncJobIndexResp); //获取同步任务列表
  rpc deptSyncJobUpdate(DeptSyncJob) returns(Empty); //更新同步任务
  rpc deptSyncJobDelete(WithID) returns(Empty); //删除同步任务
}

message DeptUserIndexReq{
  PageInfo page =1;
  int64 deptID = 2;
}

message DeptUserIndexResp{
  int64 total = 1;
  repeated DeptUser list = 2;//部门列表
}

message DeptUser{
  int64 id =1;
  int64  userID = 2;
  int64 deptID =3;
  string deptIDPath=4;
  int64 authType =5;//授权类型
  int64 isAuthChildren =6;//同时授权子节点
}

message DeptUserMultiDeleteReq{
  int64 deptID = 1;
  repeated int64 ids = 2;//需要删除的id列表
}

message DeptUserMultiCreateReq{
  int64 deptID = 1;
  repeated int64 userIDs = 2;
  int64 authType =3;//授权类型
  int64 isAuthChildren =4;//同时授权子节点
}

message DeptRoleIndexReq{
  int64 deptID = 1;
}

message DeptRoleIndexResp{
  int64 total = 1;
  repeated RoleInfo list = 2;//部门列表
}

message DeptRoleMultiSaveReq{
  int64 deptID = 1;
  repeated int64 roleIDs = 2;//API列表数据
}

message DeptSyncJobReadReq{
  int64 id = 1;
}

message DeptSyncJob{
  int64 id = 1;
  int64 direction =2;// 同步的方向,1上游同步到联犀(默认),2联犀同步到下游
  string thirdType =3;//同步的类型
  ThirdAppConfig thirdConfig =4;//第三方配置
  map<string,string> fieldMap = 5;//用户字段映射,左边是联犀的字段,右边是第三方的,不填写就是全量映射
  repeated int64 syncDeptIDs=6;//同步的第三方部门id列表,不填为同步全部
  int64 isAddSync =7;//新增人员自动同步,默认为1
  int64 syncMode =8;//同步模式: 1:手动(默认) 2: 定时同步(半小时) 3: 实时同步
  int64 createdTime =9;//创建时间
}

message DeptSyncJobIndexReq{
  PageInfo page = 1;//分页信息
  int64 direction =2;// 同步的方向,1上游同步到联犀(默认),2联犀同步到下游
  string thirdType =3;//同步的类型
  int64 syncMode =8;//同步模式: 1:手动(默认) 2: 定时同步(半小时) 3: 实时同步
}

message DeptSyncJobIndexResp{
  repeated  DeptSyncJob list =1;
  int64 total = 2;
}

message DeptInfoReadReq{
  int64 id = 1;
  bool withFather = 2;//是否返回父级
  bool withChildren =3;//是否返回子级
  string tenantCode =10;//指定租户,只有超级管理员可以操作
}

message DeptSyncJobExecuteReq{
  int64 jobID =1;//同步任务的ID
}

message DeptSyncJobExecuteResp{
}

message DeptInfo{
  int64 id = 1;
  string name= 2;         // 部门名称
  google.protobuf.StringValue desc = 3;        // 模块描述
  int64 status = 4; // 状态  1:启用,2:禁用
  int64 parentID =5;//父节点
  DeptInfo parent =6;
  repeated DeptInfo children =7;
  int64 sort = 8;          // 排序标记
  string idPath = 9;
  int64 userCount = 10;//只读,用户统计,包含下级部门的人数
  int64 dingTalkID = 11;// 钉钉的部门ID
  int64 adminUserID =12;//管理员账号
}

message DeptInfoIndexReq{
  PageInfo page = 1;//分页信息
  int64 parentID =2;//父节点
  int64 status = 3; // 状态  1:启用,2:禁用
  string name = 4;  // 部门名称
  string tenantCode =10;//指定租户,只有超级管理员可以操作
  repeated int64 dingTalkIDs = 11;// 钉钉的部门ID
}

message DeptInfoIndexResp{
  repeated  DeptInfo list =1;
  int64 total = 2;
}

