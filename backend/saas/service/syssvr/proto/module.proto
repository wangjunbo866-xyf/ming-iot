syntax = "proto3";

package sys;

option go_package = "pb/sys";

import "base.proto";
import "google/protobuf/wrappers.proto";

service ModuleManage{
  rpc moduleInfoCreate(ModuleInfo) returns(WithID); //添加角色
  rpc moduleInfoIndex(ModuleInfoIndexReq) returns(ModuleInfoIndexResp); //获取角色列表
  rpc moduleInfoUpdate(ModuleInfo) returns(Empty); //更新角色
  rpc moduleInfoDelete(WithIDCode) returns(Empty); //删除角色
  rpc moduleInfoRead(WithIDCode) returns(ModuleInfo);   //获取详情接口
  rpc moduleMultiImport(ModuleMultiImportReq) returns(ModuleMultiImportResp); //删除菜单
  rpc moduleMultiExport(ModuleMultiExportReq) returns(ModuleMultiExportResp); //删除菜单


  rpc moduleMenuCreate(MenuInfo) returns(WithID); //添加菜单
  rpc moduleMenuIndex(MenuInfoIndexReq) returns(MenuInfoIndexResp); //获取菜单列表
  rpc moduleMenuUpdate(MenuInfo) returns(Empty); //更新菜单
  rpc moduleMenuDelete(WithID) returns(Empty); //删除菜单

  rpc moduleMenuMultiImport(MenuMultiImportReq) returns(MenuMultiImportResp); //删除菜单
  rpc moduleMenuMultiExport(MenuMultiExportReq) returns(MenuMultiExportResp); //删除菜单

}

message ModuleInfo{
  int64 id = 1;
  string name= 2;          // 模块名称
  string code = 3;          // 模块编码
  google.protobuf.StringValue desc = 4;        // 模块描述
  int64 type = 5;
  int64 subType=12;
  string path = 6;
  string url = 7;
  string icon = 8;
  int64 order = 9;
  int64 hideInMenu = 10;
  google.protobuf.StringValue body = 11;
  int64 tag = 13;//标签: 1:通用 2:选配
  int64 purpose =14;                             //normal普通:1 platformo平台:2(那么只有default租户可以看,然后平台模块http头里不用传租户号)  project 项目:3(需要选择项目,默认选择第一个)
  int64 homeMenuID =16;          // 模块首页全屏菜单,点击应用左上角的logo会跳出这个页面及首次进入该模块的时候,如果为1 则是没有
}

message ModuleInfoIndexReq{
  PageInfo page = 1;//分页信息
  string name = 2;
  string code = 3;
  repeated string codes =4;
  string appCode = 5;
  int64 type = 6;
  int64 purpose =7;                             //normal普通:1 platformo平台:2(那么只有default租户可以看,然后平台模块http头里不用传租户号)  project 项目:3(需要选择项目,默认选择第一个)
  repeated int64 purposes =8;       //normal普通:1 platformo平台:2(那么只有default租户可以看,然后平台模块http头里不用传租户号)  project 项目:3(需要选择项目,默认选择第一个)
}

message ModuleInfoIndexResp{
  repeated  ModuleInfo list =1;
  int64 total = 2;
}

message ModuleMultiImportReq{
  string modules =1; //导出的模块
}

message ModuleMultiImportResp{
  int64 total =1;                                 //导入总接口数
  int64  errCount =2; //失败数
  int64  ignoreCount =3; //忽略数
  int64  succCount =4; //成功数
}

message ModuleMultiExportReq{
  repeated string  moduleCodes =1;                               // 应用编号
}

message ModuleMultiExportResp{
  string modules =1; //导出的模块
}

message MenuMultiImportReq{
  string  moduleCode =1;                               // 应用编号
  int64  mode =2;//同步模式, 1 只新增,不修改(默认) 2 新增并修改 3 新增修改及删除不存在的
  string menu =3;//菜单json
}

message MenuMultiImportResp{
    int64 total =1;                                 //导入总接口数
    int64  errCount =2; //失败数
    int64  ignoreCount =3; //忽略数
    int64  succCount =4; //成功数
}

message MenuMultiExportReq{
  string  moduleCode =1;                               // 应用编号

}

message MenuMultiExportResp{
  string menu =1; //导出的菜单json文件
}

message MenuInfoIndexReq{
  string  moduleCode = 1;
  repeated int64 menuIDs = 2;
  bool isRetTree = 3;
  int64 isCommon =4;//是否常用菜单 1-是 2-否
  int64 isAllTenant = 16;//菜单是否提供给所有租户 1-是 2-否
}

message MenuInfo{
  string moduleCode = 12;
  int64 id = 1;
  string name = 2;
  int64 parentID = 3;
  int64 type = 4;
  string path = 5;
  string component = 6;
  string icon = 7;
  string redirect = 8;
  int64 createdTime = 9;
  int64 order = 10;
  int64 hideInMenu = 11;
  int64 isCommon =15;//是否常用菜单 1-是 2-否
  int64 isAllTenant = 16;//菜单是否提供给所有租户 1-是 2-否
  google.protobuf.StringValue body = 13;
  repeated MenuInfo children = 14;
}

message MenuInfoIndexResp{
  repeated MenuInfo list = 1;
}

