#系统管理模块-syssvr
Name: sys.rpc
ListenOn: localhost:9180
CpuThreshold: 0
Etcd:
  Hosts:
    - localhost:2379
  Key: sys.rpc
Database:
  DBType: mysql
  DSN: ${CORE_DB_DSN}
CacheRedis:
  - Host: localhost:6379
    Pass:
    Type: node
Event:
  
  Nats:
    Url: nats://localhost:4222
    Consumer: dmsvr
UserToken:
  AccessSecret: ${CORE_USER_TOKEN_SECRET}
  AccessExpire: 360000000 #有效期为一小时
UserOpt:
  NeedUserName: true
  NeedPassWord: true
  PassLevel: 2
ThirdJwtSecret: ${THIRD_JWT_SECRET}
Map:
  Mode: baidu
  AccessKey: ${CORE_MAP_ACCESS_KEY}
GoogleJWKS:
  URL:
  HeaderName: X-YKHL-JWKS-TOKEN
  AccessToken:
TimedJobRpc:
  Enable: true
  Mode: direct
  RunProxy: true
  Conf:
    Timeout: 1000000
# uni-push 2.0（配置方式同 ThirdJwtSecret：Secret 写在 sys.yaml，可选 env YK_PUSH_HTTP_SECRET 覆盖）
UniPush:
  Enabled: false
  AppId: __UNI__F82AD01
  HttpUrl: https://env-00jxufuad0x3.dev-hz.cloudbasefunction.cn/yk-push-send
  Secret: ""
  TimeoutMs: 5000
  ForceNotification: true
  NotifyCodes:
    - ruleDeviceAlarm
    - ruleScene
  PushOnMessage: true  # 兼容：message 旁路 uni-push；新场景请用 systemNotice
TimedSchedulerRpc:
  Enable: true
  Mode: direct
  RunProxy: true
  Conf:
    Timeout: 1000000
