Host: 0.0.0.0
CpuThreshold: 0
Timeout: 1000000
MaxBytes: 1000000000
Log:
  Encoding: plain
  #Mode: file
CacheRedis:
  - Host: 127.0.0.1:6379
    Pass:
    Type: node
Middlewares:
  Prometheus: false
Database:
  DBType: mysql
  DSN: ${THINGS_DB_DSN}
#  DBType: pgsql
#  DSN: ${THINGS_DB_DSN}
DevServer:
  Enabled: true
  Port: 7065
TSDB:
  Driver: taosRestful
  DSN: ${THINGS_TSDB_DSN}
#  DSN: ${THINGS_TSDB_DSN}
#  Driver: taosSql
#  DSN: ${THINGS_TSDB_DSN}
#  DBType: mysql
#  DSN: ${THINGS_TSDB_DSN}




DgRpc:
  Enable: true
  RunProxy: false
  Mode: direct
  Conf:
    Timeout: 1000000
DmRpc:
  Enable: true
  RunProxy: false
  Mode: direct
  Conf:
    Timeout: 1000000
    Etcd:
      key: dm.rpc
SysRpc:
  Enable: true
  Mode: grpc
  Conf:
    Timeout: 1000000
    Endpoints:
      - localhost:9180
TimedJobRpc:
  Enable: true
  Mode: grpc
  Conf:
    Timeout: 1000000
    Endpoints:
      - localhost:3256

UdRpc:
  Enable: true
  Mode: direct
  RunProxy: false
  Conf:
    Timeout: 1000000

OssConf:
  OssType: minio
  PublicBucketName: ithings-public
  PrivateBucketName: ithings-private
  TemporaryBucketName: ithings-temporary
  AccessKeyID: ${THINGS_OSS_ACCESS_KEY_ID}
  AccessKeySecret: ${THINGS_OSS_ACCESS_KEY_SECRET}
  Location: 127.0.0.1:9000
  ConnectTimeout: 6000
  ReadWriteTimeout: 60000
  UseSSL: false

Event:
  Nats:
    Url: nats://127.0.0.1:4222
