Host: 0.0.0.0
CpuThreshold: 0
Timeout: 1000000
MaxBytes: 1000000000
Etcd:
  Hosts:
    - etcd:2379
  Key:
Log:
  Encoding: plain
  #Mode: file
CacheRedis:
  - Host: redis:6379
    Pass:
    Type: node
Middlewares:
  Prometheus: false
Database:
  DBType: mysql
  DSN: ${THINGS_DB_DSN}
#  DBType: pgsql
#  DSN: ${THINGS_DB_DSN}
DevServer:
  Enabled: true
  Port: 7065
TSDB:
  Driver: taosRestful
  DSN: ${THINGS_TSDB_DSN}
#  DSN: ${THINGS_TSDB_DSN}
#  Driver: taosSql
#  DSN: ${THINGS_TSDB_DSN}
#  DBType: mysql
#  DSN: ${THINGS_TSDB_DSN}

DgRpc:
  Enable: true
  Mode: direct
  Conf:
    Timeout: 1000000
DmRpc:
  Enable: true
  Mode: direct
  Conf:
    Timeout: 1000000
    Etcd:
      key: dm.rpc
SysRpc:
  Enable: true
  Mode: grpc
  Conf:
    Timeout: 1000000
    Etcd:
      Key: sys.rpc
TimedJobRpc:
  Enable: true
  Mode: grpc
  Conf:
    Timeout: 1000000
    Etcd:
      Key: timedjob.rpc
TimedSchedulerRpc:
  Enable: true
  Mode: grpc
  Conf:
    Timeout: 1000000
    Etcd:
      Key: timedscheduler.rpc
UdRpc:
  Enable: true
  Mode: direct
  Conf:
    Timeout: 1000000

OssConf:
  OssType: minio
  PublicBucketName: ithings-public
  PrivateBucketName: ithings-private
  TemporaryBucketName: ithings-temporary
  AccessKeyID: ${THINGS_OSS_ACCESS_KEY_ID}
  AccessKeySecret: ${THINGS_OSS_ACCESS_KEY_SECRET}
  Location: minio:9000
  ConnectTimeout: 6000
  ReadWriteTimeout: 60000
  UseSSL: false

AuthWhite:
  Users:
    - UserName: dgsvr
      Password: ${THINGS_INTERNAL_AUTH_PASSWORD}
    - UserName: pwumeisvr
      Password: ${THINGS_INTERNAL_AUTH_PASSWORD}
    - UserName: paliMqttsvr
      Password: ${THINGS_INTERNAL_AUTH_PASSWORD}
  IpRange:
    - 127.0.0.0/8
    - 172.16.0.0/12
    - 169.254.0.0/16
    - 10.0.0.0/8

Event:
  Nats:
    Url: nats://nats:4222
